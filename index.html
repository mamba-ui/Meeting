<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting | Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    

    <div class="background">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>
    </div>

    <main class="auth-container">

        <!-- Logo / Brand -->
        <div class="brand">
            <div class="brand-icon">M</div>
            <h1>Meeting</h1>
            <p>Connect. Talk. Meet.</p>
        </div>

        <div class="auth-card">

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" id="loginTab">Login</button>
                <button class="tab" id="signupTab">Create Account</button>
            </div>

            <!-- Message -->
            <div id="message" class="message"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form">

                <div class="input-group">
                    <label for="loginPhone">Telephone Number</label>
                    <div class="input-box">
                        <span class="input-icon">📱</span>
                        <input
                            type="tel"
                            id="loginPhone"
                            placeholder="e.g. 0781234567"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-box">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="loginPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="main-button">
                    Login
                    <span>→</span>
                </button>

                <div class="switch-text">
                    Don't have an account?
                    <button type="button" id="goSignup">Create one</button>
                </div>

            </form>


            <!-- SIGN UP FORM -->
            <form id="signupForm" class="auth-form hidden">

                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-box">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPhone">Telephone Number</label>
                    <div class="input-box">
                        <span class="input-icon">📱</span>
                        <input
                            type="tel"
                            id="signupPhone"
                            placeholder="e.g. 0781234567"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-box">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="signupPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-box">
                        <span class="input-icon">🔐</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" id="terms" required>
                        <span>
                            I agree to the <a href="#">Terms & Conditions</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="main-button">
                    Create Account
                    <span>→</span>
                </button>

                <div class="switch-text">
                    Already have an account?
                    <button type="button" id="goLogin">Login</button>
                </div>

            </form>

        </div>

        <footer>
            © 2026 Meeting. Connect with people around you.
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
